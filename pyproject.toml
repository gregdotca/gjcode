[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gjcode"
version = "0.0.14"
authors = [
  { name="Greg Chetcuti", email="greg@chetcuti.com" },
]
license = "MIT"
description = "A collection of my personal Python code"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[project.urls]
"Homepage" = "https://github.com/gregdotca/gjcode"
"Bug Tracker" = "https://github.com/gregdotca/gjcode/issues"

[tool.bumpver]
current_version = "0.0.14"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = false
tag =  false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"src/gjcode/__init__.py" = ["{version}"]

